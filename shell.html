<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Space Raiders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #02060b;
            color: #dcecff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 18%,
                    #102238 0%,
                    #07111d 35%,
                    #02060b 75%,
                    #000 100%
                );
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            flex: 0 0 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            border-bottom:
                1px solid rgba(80, 180, 255, 0.15);

            background:
                linear-gradient(
                    180deg,
                    rgba(7, 17, 30, 0.98),
                    rgba(3, 9, 16, 0.95)
                );

            box-shadow:
                0 6px 25px rgba(0, 0, 0, 0.35);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .logo-mark {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(80, 210, 255, 0.65);

            color: #6ee7ff;

            font-size: 14px;

            transform: rotate(45deg);

            box-shadow:
                0 0 16px rgba(50, 200, 255, 0.15);
        }


        .logo-mark span {
            transform: rotate(-45deg);
        }


        .logo-text {
            display: flex;
            flex-direction: column;
        }


        .logo-title {
            color: #e9f7ff;

            font-size: 17px;
            font-weight: 800;

            letter-spacing: 3px;
        }


        .logo-subtitle {
            margin-top: 2px;

            color: #5e7890;

            font-size: 8px;

            letter-spacing: 2px;
        }


        /* =====================================================
           HEADER RIGHT
        ===================================================== */

        .header-right {
            display: flex;
            align-items: center;

            gap: 16px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: flex;
            align-items: center;

            gap: 8px;

            color: #718ca3;

            font-size: 9px;

            letter-spacing: 2px;
        }


        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #43e6a4;

            box-shadow:
                0 0 8px rgba(67, 230, 164, 0.8);
        }


        /* =====================================================
           FULLSCREEN BUTTON
        ===================================================== */

        .fullscreen-button {
            height: 32px;

            padding: 0 13px;

            border:
                1px solid rgba(90, 200, 255, 0.28);

            background:
                rgba(20, 55, 80, 0.35);

            color: #9edfff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease;
        }


        .fullscreen-button:hover {
            background:
                rgba(40, 110, 150, 0.45);

            border-color:
                rgba(90, 210, 255, 0.65);

            color: #ffffff;
        }


        .fullscreen-button:active {
            transform: translateY(1px);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;

            min-height: 0;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 12px 20px 8px;

            overflow: hidden;
        }


        /* =====================================================
           INTRO
        ===================================================== */

        .intro {
            flex: 0 0 auto;

            text-align: center;

            margin-bottom: 10px;
        }


        .eyebrow {
            color: #5acfff;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 3px;
        }


        .heading {
            margin: 0;

            color: #eef9ff;

            font-size:
                clamp(20px, 2.5vw, 30px);

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                0 0 25px rgba(60, 190, 255, 0.12);
        }


        .description {
            margin: 4px auto 0;

            color: #65cfff;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 1.5px;

            line-height: 1.3;

            text-transform: none;
        }


        /* =====================================================
           GAME FRAME
        ===================================================== */

        .game-shell {
            position: relative;

            width: min(
                1600px,
                calc(100vw - 40px),
                calc((100vh - 210px) * 1.7777777778)
            );

            aspect-ratio: 16 / 9;

            flex: 0 1 auto;

            padding: 5px;

            background:
                linear-gradient(
                    135deg,
                    rgba(68, 203, 255, 0.38),
                    rgba(20, 50, 80, 0.08) 40%,
                    rgba(20, 50, 80, 0.08) 60%,
                    rgba(68, 203, 255, 0.22)
                );

            box-shadow:
                0 0 0 1px rgba(80, 200, 255, 0.10),
                0 14px 55px rgba(0, 0, 0, 0.70),
                0 0 60px rgba(20, 150, 255, 0.07);
        }


        .game-container {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =====================================================
           GAME CANVAS
        ===================================================== */

        #canvas {
            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: none;

            background: #000;

            image-rendering: auto;
        }


        /* =====================================================
           FRAME CORNERS
        ===================================================== */

        .corner {
            position: absolute;

            width: 18px;
            height: 18px;

            z-index: 5;

            pointer-events: none;
        }


        .corner::before,
        .corner::after {
            content: "";

            position: absolute;

            background: #5edcff;
        }


        .corner::before {
            width: 18px;
            height: 1px;
        }


        .corner::after {
            width: 1px;
            height: 18px;
        }


        .corner.tl {
            top: 0;
            left: 0;
        }


        .corner.tr {
            top: 0;
            right: 0;

            transform: rotate(90deg);
        }


        .corner.bl {
            bottom: 0;
            left: 0;

            transform: rotate(-90deg);
        }


        .corner.br {
            bottom: 0;
            right: 0;

            transform: rotate(180deg);
        }


        /* =====================================================
           INFO BAR
        ===================================================== */

        .info-bar {
            flex: 0 0 34px;

            width: min(
                1600px,
                calc(100vw - 40px)
            );

            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            margin-top: 7px;

            padding: 0 12px;

            border-top:
                1px solid rgba(90, 190, 240, 0.10);

            border-bottom:
                1px solid rgba(90, 190, 240, 0.10);

            background:
                rgba(5, 14, 24, 0.65);
        }


        .info-left,
        .info-right {
            color: #607a91;

            font-size: 8px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .info-center {
            color: #75dfff;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-align: center;
        }


        .info-right {
            text-align: right;
        }


        /* =====================================================
           CONTROLS
        ===================================================== */

        .controls {
            flex: 0 0 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-top: 4px;
        }


        .control {
            display: flex;
            align-items: center;

            gap: 5px;

            color: #617a90;

            font-size: 8px;

            letter-spacing: 0.8px;
        }


        .key {
            padding: 3px 6px;

            border:
                1px solid rgba(100, 200, 255, 0.20);

            background:
                rgba(30, 70, 100, 0.25);

            color: #bdeeff;

            font-size: 8px;

            font-weight: 700;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            flex: 0 0 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-top:
                1px solid rgba(80, 180, 255, 0.08);

            color: #3e5568;

            font-size: 7px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        #loading {
            position: fixed;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #0d1d2d,
                    #02060b 70%
                );

            color: #bdeeff;

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            z-index: 100;
        }


        #loading.hidden {
            display: none;
        }


        .loading-line {
            width: 150px;
            height: 1px;

            margin-top: 14px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #5edcff,
                    transparent
                );
        }


        .creator-credit {
            margin-top: 18px;

            color: #5acfff;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.85;

            text-align: center;
        }


        /* =====================================================
           SMALL SCREENS
        ===================================================== */

        @media (max-width: 700px) {

            .header {
                flex-basis: 52px;

                padding: 0 14px;
            }


            .logo-title {
                font-size: 13px;
            }


            .logo-subtitle {
                display: none;
            }


            .status {
                display: none;
            }


            .header-right {
                gap: 0;
            }


            .fullscreen-button {
                height: 28px;

                padding: 0 9px;

                font-size: 7px;
            }


            .main {
                padding: 8px 8px 5px;
            }


            .description {
                font-size: 8px;

                letter-spacing: 1px;
            }


            .intro {
                margin-bottom: 7px;
            }


            .game-shell {
                width: calc(100vw - 16px);
            }


            .info-bar {
                width: calc(100vw - 16px);
            }


            .controls {
                gap: 5px;
            }


            .control {
                font-size: 7px;
            }


            .footer {
                display: none;
            }
        }

    </style>
</head>


<body>

<div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">

            <div class="logo-mark">
                <span>✦</span>
            </div>

            <div class="logo-text">

                <div class="logo-title">
                    SPACE RAIDERS
                </div>

                <div class="logo-subtitle">
                    DEEP SPACE DEFENSE SYSTEM
                </div>

            </div>

        </div>


        <div class="header-right">

            <div class="status">

                <div class="status-dot"></div>

                SYSTEM ONLINE

            </div>


            <button
                id="fullscreen-button"
                class="fullscreen-button"
                type="button"
            >
                ⛶ FULL SCREEN
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <section class="intro">

            <div class="eyebrow">
                Mission Control
            </div>


            <h1 class="heading">
                Space Raiders
            </h1>


            <p class="description">
                Created by Muhammad Huzaifa
            </p>

        </section>


        <!-- =================================================
             GAME
        ================================================== -->

        <section
            id="game-shell"
            class="game-shell"
        >

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>


            <div class="game-container">

                <canvas
                    id="canvas"
                    tabindex="0"
                ></canvas>

            </div>

        </section>

<!-- =========================================================
     LOADING
========================================================== -->

<div id="loading">

    <div>
        INITIALIZING SPACE RAIDERS
    </div>


    <div class="loading-line"></div>


    <div class="creator-credit">
        CREATED BY MUHAMMAD HUZAIFA
    </div>

</div>


<!-- =========================================================
     EMSCRIPTEN
========================================================== -->

<script>

    var Module = {

        canvas:
            document.getElementById("canvas"),


        print: function(text) {
            console.log(text);
        },


        printErr: function(text) {
            console.error(text);
        },


        setStatus: function(text) {

            if (text) {
                console.log(text);
            }

        },


        onRuntimeInitialized: function() {

            document
                .getElementById("loading")
                .classList.add("hidden");


            document
                .getElementById("canvas")
                .focus();

        }

    };


    /* =========================================================
       GAME KEYBOARD HANDLING

       Prevent browser scrolling when using:
       SPACE
       ARROW KEYS
    ========================================================= */

    window.addEventListener(
        "keydown",
        function(event) {

            const blockedKeys = [
                " ",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ];


            if (blockedKeys.includes(event.key)) {

                event.preventDefault();

            }

        },
        {
            capture: true
        }
    );


    /* =========================================================
       KEEP GAME FOCUSED
    ========================================================= */

    document
        .getElementById("canvas")
        .addEventListener(
            "click",
            function() {

                this.focus();

            }
        );


    /* =========================================================
       FULLSCREEN
    ========================================================= */

    const fullscreenButton =
        document.getElementById(
            "fullscreen-button"
        );


    const gameShell =
        document.getElementById(
            "game-shell"
        );


    fullscreenButton.addEventListener(
        "click",
        async function() {

            try {

                if (!document.fullscreenElement) {

                    await gameShell.requestFullscreen();

                }
                else {

                    await document.exitFullscreen();

                }

            }
            catch (error) {

                console.error(
                    "Fullscreen failed:",
                    error
                );

            }

        }
    );


    /* =========================================================
       FULLSCREEN STATE
    ========================================================= */

    document.addEventListener(
        "fullscreenchange",
        function() {

            if (document.fullscreenElement) {

                fullscreenButton.textContent =
                    "⛶ EXIT FULL SCREEN";

            }
            else {

                fullscreenButton.textContent =
                    "⛶ FULL SCREEN";

            }

        }
    );

</script>

</html>
